; PlatformIO Project Configuration for PocketDSO
; Target Board: Waveshare ESP32-C6-Touch-LCD-1.47-M

[platformio]
src_dir = oscilloscope

[env:esp32-c6-devkitm-1]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.10.30/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    mathieucarbou/ESPAsyncWebServer@^3.3.17
    mathieucarbou/AsyncTCP@^3.3.1

